<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#080B12" flood-opacity=".45"/>
  </filter>
  <linearGradient id="gNova" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#F472B6"/>
    <stop offset="50%" stop-color="#C084FC"/>
    <stop offset="100%" stop-color="#9333EA"/>
  </linearGradient>
  <linearGradient id="gGold" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#FDE68A"/>
    <stop offset="100%" stop-color="#F59E0B"/>
  </linearGradient>
</defs>
<g filter="url(#shadow)">
  <!-- Outer Arcane Star Crest -->
  <polygon points="128,16 156,76 220,84 172,130 186,194 128,162 70,194 84,130 36,84 100,76" fill="#171D2B" stroke="#C084FC" stroke-width="8"/>
  <!-- Inner Arcane Core Shield -->
  <polygon points="128,38 188,78 188,158 128,198 68,158 68,78" fill="url(#gNova)"/>
  <!-- Gold Astral Crown -->
  <polygon points="128,52 144,82 172,82 148,102 158,130 128,112 98,130 108,102 84,82 112,82" fill="url(#gGold)"/>
  <!-- Central Glowing Heart Gem -->
  <polygon points="128,88 146,114 128,140 110,114" fill="#FFFFFF"/>
</g>
</svg>
