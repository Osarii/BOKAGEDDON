<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#080B12" flood-opacity=".45"/>
  </filter>
  <linearGradient id="gHexGreen" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#4ADE80"/>
    <stop offset="50%" stop-color="#22C55E"/>
    <stop offset="100%" stop-color="#15803D"/>
  </linearGradient>
  <linearGradient id="gVoid" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0%" stop-color="#2E1065"/>
    <stop offset="100%" stop-color="#0F081D"/>
  </linearGradient>
</defs>
<g filter="url(#shadow)">
  <!-- Outer Void Shroud Octagon -->
  <polygon points="128,18 196,48 228,116 200,186 128,228 56,186 28,116 60,48" fill="#0B0F19" stroke="#22C55E" stroke-width="8"/>
  <!-- Dark Hood Cowl -->
  <polygon points="128,34 184,80 174,170 128,206 82,170 72,80" fill="url(#gVoid)"/>
  <!-- Void Horn Antennas -->
  <polygon points="92,42 66,20 84,68" fill="url(#gHexGreen)"/>
  <polygon points="164,42 190,20 172,68" fill="url(#gHexGreen)"/>
  <!-- Void Mask Visor Plate -->
  <polygon points="128,100 162,126 150,166 128,178 106,166 94,126" fill="#050508" stroke="#8B5CF6" stroke-width="4"/>
  <!-- Glowing Hex Eyes -->
  <polygon points="112,128 122,136 112,144 102,136" fill="#22C55E"/>
  <polygon points="144,128 154,136 144,144 134,136" fill="#22C55E"/>
</g>
</svg>
