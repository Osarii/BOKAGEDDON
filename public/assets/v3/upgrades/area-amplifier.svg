<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Area Amplifier">
<title>Area Amplifier</title>
<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.45" stop-color="#8fa6bd"/>
    <stop offset="1" stop-color="#22303f"/>
  </linearGradient>
</defs>


<circle cx="128" cy="128" r="78" fill="none" stroke="#ff7a24" stroke-width="8" opacity=".3"/>
<circle cx="128" cy="128" r="51" fill="none" stroke="#ffd1b5" stroke-width="7" filter="url(#glow)"/>
<circle cx="128" cy="128" r="20" fill="#ff7a24" filter="url(#glow)"/>
<path d="M128 22v34M128 200v34M22 128h34M200 128h34" stroke="#ff7a24" stroke-width="8" stroke-linecap="round"/>
