<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Rift Disc">
<title>Rift Disc</title>
<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.45" stop-color="#8fa6bd"/>
    <stop offset="1" stop-color="#22303f"/>
  </linearGradient>
</defs>


<ellipse cx="128" cy="128" rx="84" ry="38" fill="#120a24" stroke="#a569ff" stroke-width="9" transform="rotate(-18 128 128)" filter="url(#glow)"/>
<ellipse cx="128" cy="128" rx="47" ry="17" fill="#05060e" stroke="#e6d7ff" stroke-width="6" transform="rotate(-18 128 128)"/>
<path d="M62 132c36-20 91-25 136-7" fill="none" stroke="#6d28d9" stroke-width="8" stroke-linecap="round"/>
<path d="m183 91 18 20-25 6" fill="#d8c6ff"/>

</svg>